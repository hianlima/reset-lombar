<link rel="stylesheet" href="/lp/lp.css">
</head>
<body>

<div class="fstage">
  <div class="fcol">
    <div class="fchat-header">
      <div class="fchat-avatar">HL</div>
      <div>
        <div class="fname">Dr. Hian Lima</div>
        <div class="fstatus">online agora</div>
      </div>
    </div>

    <div class="fchat-wrap" id="chatWrap"></div>

    <a href="/lp/etapa06.html" class="fcta green fcta-pulse" id="btnNext" style="display:none; margin-top:18px;">Quero continuar <span class="arrow">→</span></a>
  </div>
</div>

<script src="/lp/lp.js"></script>
<script>
  Funil.lockStep();
  Funil.trackEtapa("Etapa5_View");
  if (typeof gtag === "function") gtag("event", "funil_etapa5_view");

  var chatWrap = document.getElementById("chatWrap");
  var btnNext = document.getElementById("btnNext");

  function scrollDown(){ chatWrap.scrollTop = chatWrap.scrollHeight; }
  function randDelay(min, max){ return min + Math.random() * (max - min); }
  function nowTime(){
    return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  var ticksSvg = '<svg class="fchat-ticks" viewBox="0 0 16 11" width="16" height="11" fill="none">' +
    '<path d="M11.3 0.7 4.8 7.2 1.6 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M14.8 0.7 7.7 7.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';

  function addTyping(){
    var row = document.createElement("div");
    row.className = "fchat-row them";
    row.innerHTML = '<div class="fchat-bubble typing"><span></span><span></span><span></span></div>';
    chatWrap.appendChild(row);
    scrollDown();
    return row;
  }

  function botSay(text, delayMs, cb){
    var typing = addTyping();
    setTimeout(function(){
      typing.remove();
      var row = document.createElement("div");
      row.className = "fchat-row them";
      row.innerHTML = '<div class="fchat-bubble">' + text +
        '<div class="fchat-meta"><span class="fchat-time">' + nowTime() + '</span></div></div>';
      chatWrap.appendChild(row);
      scrollDown();
      if (cb) cb();
    }, delayMs);
  }

  function buildWave(n){
    var bars = "";
    for (var i = 0; i < n; i++) {
      bars += '<span style="height:' + (4 + Math.round(Math.random() * 14)) + 'px"></span>';
    }
    return bars;
  }

  function wireAudioBubble(row){
    var btn = row.querySelector(".faudio-play");
    var iconPlay = row.querySelector(".icon-play");
    var iconPause = row.querySelector(".icon-pause");
    var fg = row.querySelector(".faudio-bars-fg");
    var timeEl = row.querySelector(".faudio-time");
    var audio = row.querySelector(".faudio-el");

    function fmt(sec){
      sec = Math.max(0, Math.round(sec || 0));
      var m = Math.floor(sec / 60), s = sec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    audio.addEventListener("loadedmetadata", function(){
      if (isFinite(audio.duration)) timeEl.textContent = fmt(audio.duration);
    });
    audio.addEventListener("timeupdate", function(){
      if (audio.duration) {
        fg.style.width = (audio.currentTime / audio.duration * 100) + "%";
        timeEl.textContent = fmt(audio.duration - audio.currentTime);
      }
    });
    audio.addEventListener("ended", function(){
      iconPlay.style.display = "";
      iconPause.style.display = "none";
      fg.style.width = "0%";
      if (isFinite(audio.duration)) timeEl.textContent = fmt(audio.duration);
    });

    btn.addEventListener("click", function(){
      if (audio.paused) {
        document.querySelectorAll(".faudio-el").forEach(function(a){ if (a !== audio) a.pause(); });
        audio.play().catch(function(){});
        iconPlay.style.display = "none";
        iconPause.style.display = "";
      } else {
        audio.pause();
        iconPlay.style.display = "";
        iconPause.style.display = "none";
      }
    });
  }

  function botSayAudio(src, delayMs, cb){
    var typing = addTyping();
    setTimeout(function(){
      typing.remove();
      var row = document.createElement("div");
      row.className = "fchat-row them";
      var bars = buildWave(28);
      row.innerHTML =
        '<div class="fchat-bubble fchat-audio">' +
          '<div class="faudio-row">' +
            '<button type="button" class="faudio-play" aria-label="Reproduzir áudio">' +
              '<svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M8 5v14l11-7z"/></svg>' +
              '<svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="#fff" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>' +
            '</button>' +
            '<div class="faudio-wave">' +
              '<div class="faudio-bars-bg">' + bars + '</div>' +
              '<div class="faudio-bars-fg">' + bars + '</div>' +
            '</div>' +
            '<div class="faudio-time">0:00</div>' +
          '</div>' +
          '<div class="fchat-meta"><span class="fchat-time">' + nowTime() + '</span></div>' +
          '<audio class="faudio-el" src="' + src + '" preload="metadata"></audio>' +
        '</div>';
      chatWrap.appendChild(row);
      scrollDown();
      wireAudioBubble(row);
      if (cb) cb();
    }, delayMs);
  }

  function meSay(text){
    var row = document.createElement("div");
    row.className = "fchat-row me";
    row.innerHTML = '<div class="fchat-bubble">' + text +
      '<div class="fchat-meta"><span class="fchat-time">' + nowTime() + '</span>' + ticksSvg + '</div></div>';
    chatWrap.appendChild(row);
    scrollDown();

    var ticks = row.querySelector(".fchat-ticks");
    setTimeout(function(){ ticks.classList.add("read"); }, 700);
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showNameInput(onDone){
    var row = document.createElement("div");
    row.className = "fchat-row me";
    row.innerHTML =
      '<div class="fchat-name-form">' +
        '<input type="text" class="fchat-name-field" placeholder="Digite seu nome" maxlength="30" autocomplete="given-name">' +
        '<button type="button" class="fchat-name-send" aria-label="Enviar" disabled>' +
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>' +
        '</button>' +
      '</div>';
    chatWrap.appendChild(row);
    scrollDown();

    var input = row.querySelector(".fchat-name-field");
    var sendBtn = row.querySelector(".fchat-name-send");
    input.focus();

    input.addEventListener("input", function(){
      sendBtn.disabled = input.value.trim().length === 0;
    });

    function submit(){
      var raw = input.value.trim();
      if (!raw) return;
      var nome = raw.charAt(0).toUpperCase() + raw.slice(1);
      row.remove();
      meSay(escapeHtml(nome));
      try { localStorage.setItem("resposta_nome", nome); } catch(e){}
      Funil.trackEtapa("Etapa5_NomeCapturado");
      if (typeof gtag === "function") gtag("event", "quiz_nome_informado");
      onDone(nome);
    }

    input.addEventListener("keydown", function(e){
      if (e.key === "Enter") submit();
    });
    sendBtn.addEventListener("click", submit);
  }

  /* ---- roteiro do mini-quiz (3 perguntas) ---- */
  var questions = [
    {
      key: "resposta_localizacao",
      text: "Onde você sente a dor com mais frequência?",
      options: ["Só na lombar", "Desce até o glúteo ou a coxa", "Desce até abaixo do joelho, na perna toda"]
    },
    {
      key: "resposta_gatilho",
      text: "O que geralmente piora sua dor?",
      options: ["Ficar muito tempo sentado", "Ficar muito tempo em pé ou caminhando", "Se abaixar ou pegar peso"]
    },
    {
      key: "resposta_historico",
      text: "Você já tentou tratar antes (fisioterapia, alongamento, remédio) e a dor voltou?",
      options: ["Sim, várias vezes", "Já tentei uma vez", "Ainda não tratei de forma nenhuma"]
    }
  ];

  function askQuestion(i, delayMs){
    var q = questions[i];
    botSay(q.text, delayMs, function(){
      showOptions(q, i);
    });
  }

  function showOptions(q, i){
    var hint = document.createElement("div");
    hint.className = "fchat-tap-hint";
    hint.innerHTML = 'Toque pra responder <span class="tap-ico">👆</span>';
    chatWrap.appendChild(hint);

    var row = document.createElement("div");
    row.className = "fchat-row me";
    var group = document.createElement("div");
    group.className = "fchat-choice-group";
    row.appendChild(group);

    q.options.forEach(function(label){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "fchat-choice-bubble";
      btn.innerHTML = "<span>" + label + "</span><span class=\"fchat-choice-arrow\">›</span>";
      btn.addEventListener("click", function(){
        hint.remove();
        row.remove();
        meSay(label);

        try { localStorage.setItem(q.key, label); } catch(e){}
        Funil.trackEtapa("Etapa5_Quiz_" + q.key);
        if (typeof gtag === "function") gtag("event", "quiz_pergunta" + (i + 1) + "_respondida");

        if (i + 1 < questions.length) {
          askQuestion(i + 1, randDelay(300, 500));
        } else {
          finish();
        }
      });
      group.appendChild(btn);
    });

    chatWrap.appendChild(row);
    scrollDown();
  }

  function finish(){
    botSayAudio("/audio/etapa05-diagnostico.mp3", 2000, function(){
      btnNext.style.display = "flex";
      Funil.trackEtapa("Etapa5_QuizCompleted");
      if (typeof gtag === "function") gtag("event", "quiz_completed");
    });
  }

  botSay("Antes de continuar, deixa eu te conhecer melhor. Qual é o seu nome?", randDelay(900, 1300), function(){
    showNameInput(function(nome){
      botSay("Prazer, " + escapeHtml(nome) + "! Agora deixa eu entender rapidinho seu caso. São só 3 perguntas.", randDelay(900, 1300), function(){
        askQuestion(0, randDelay(900, 1300));
      });
    });
  });

  btnNext.addEventListener("click", function(){
    Funil.trackEtapa("Etapa5_Click");
    if (typeof gtag === "function") gtag("event", "funil_etapa5_click");
  });
</script>
</body>
</html>
