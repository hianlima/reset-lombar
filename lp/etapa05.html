<link rel="stylesheet" href="lp.css">

<body>

<div class="fstage">
  <div class="fcol">
    <div class="fchat-header">
      <div class="fchat-avatar">HL</div>
      <div>
        <div class="fname">Dr. Hian Lima</div>
        <div class="fstatus">online agora</div>
      </div>
    </div>

    <div class="fchat-wrap" id="chatWrap"></div>

    <a href="etapa06.html" class="fcta green fcta-pulse" id="btnNext" style="display:none; margin-top:18px;">Continuar <span class="arrow">→</span></a>
  </div>
</div>

<script src="lp.js"></script>
<script>
  Funil.trackEtapa("Etapa5_View");

  var chatWrap = document.getElementById("chatWrap");

  function scrollDown(){ chatWrap.scrollTop = chatWrap.scrollHeight; }

  function addTyping(){
    var row = document.createElement("div");
    row.className = "fchat-row them";
    row.innerHTML = '<div class="fchat-bubble typing"><span></span><span></span><span></span></div>';
    chatWrap.appendChild(row);
    scrollDown();
    return row;
  }

  function botSay(text, cb){
    var typing = addTyping();
    var thinkTime = Math.min(6000, Math.max(900, 500 + text.length * 16));
    setTimeout(function(){
      typing.remove();
      var row = document.createElement("div");
      row.className = "fchat-row them";
      row.innerHTML = '<div class="fchat-bubble">' + text + '</div>';
      chatWrap.appendChild(row);
      scrollDown();
      setTimeout(cb, 650);
    }, thinkTime);
  }

  function botImage(src, caption, cb){
    var typing = addTyping();
    setTimeout(function(){
      typing.remove();
      var row = document.createElement("div");
      row.className = "fchat-row them";
      row.innerHTML = '<div class="fchat-bubble fchat-img"><img src="' + src + '" alt=""><div class="fchat-cap">' + caption + '</div></div>';
      chatWrap.appendChild(row);
      scrollDown();
      setTimeout(cb, 700);
    }, 1300);
  }

  function meSay(text){
    var row = document.createElement("div");
    row.className = "fchat-row me";
    row.innerHTML = '<div class="fchat-bubble">' + text + '</div>';
    chatWrap.appendChild(row);
    scrollDown();
  }

  function showChoices(options){
    var hint = document.createElement("div");
    hint.className = "fchat-tap-hint";
    hint.innerHTML = 'Toque pra responder <span class="tap-ico">👆</span>';
    chatWrap.appendChild(hint);

    var row = document.createElement("div");
    row.className = "fchat-row me";
    var group = document.createElement("div");
    group.className = "fchat-choice-group";
    row.appendChild(group);

    options.forEach(function(opt){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "fchat-choice-bubble";
      btn.innerHTML = '<span>' + opt.label + '</span><span class="fchat-choice-arrow">›</span>';
      btn.addEventListener("click", function(){
        hint.remove();
        row.remove();
        meSay(opt.label);
        Funil.trackEtapa("Etapa5_Choice_" + opt.id);
        opt.next();
      });
      group.appendChild(btn);
    });

    chatWrap.appendChild(row);
    scrollDown();
  }

  var btnNext = document.getElementById("btnNext");
  btnNext.addEventListener("click", function(){
    Funil.trackEtapa("Etapa5_Click");
  });
  function showContinue(){
    btnNext.style.display = "flex";
  }

  /* ---- roteiro do chat ---- */
  botSay("Oi! Que bom te ver por aqui 👋", function(){
    botSay("Posso te fazer uma pergunta rápida antes de continuar?", function(){
      botSay("Você já tentou resolver essa dor lombar por conta própria, tipo com vídeo de Youtube ou dica de alguém, e não rolou?", function(){
        showChoices([
          {
            id: "ja_tentei",
            label: "Já tentei de tudo 😩",
            next: function(){
              botSay("Imaginei. Isso é super comum, viu.", function(){
                botSay("A maioria dos exercícios prontos por aí não leva em conta a SUA direção de dor.", step2);
              });
            }
          },
          {
            id: "primeira_vez",
            label: "Ainda não, é minha primeira vez",
            next: function(){
              botSay("Boa, já começa pelo caminho certo então.", function(){
                botSay("Porque a maioria dos exercícios prontos por aí não leva em conta a SUA direção de dor.", step2);
              });
            }
          }
        ]);
      });
    });
  });

  function step2(){
    botSay("E isso muda tudo. Dá uma olhada nisso aqui 👇", function(){
      botImage("../img/depoimento-marcio.jpg", "Print real de conversa com paciente", function(){
        botSay("Show, né? Bora pro próximo passo, vou te mostrar os números de como isso tem ajudado outras pessoas.", function(){
          showContinue();
          Funil.trackEtapa("Etapa5_ChatCompleted");
        });
      });
    });
  }
</script>
</body>
</html>
