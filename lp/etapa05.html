<body>

<div class="fstage">
  <div class="fcol">
    <div class="fchat-header">
      <div class="fchat-avatar">HL</div>
      <div>
        <div class="fname">Dr. Hian Lima</div>
        <div class="fstatus">online agora</div>
      </div>
    </div>

    <div class="fchat-wrap" id="chatWrap"></div>

    <a href="etapa06.html" class="fcta green fcta-pulse" id="btnNext" style="display:none; margin-top:18px;">Quero continuar <span class="arrow">→</span></a>
  </div>
</div>

<script src="lp.js"></script>
<script>
  Funil.trackEtapa("Etapa5_View");

  var chatWrap = document.getElementById("chatWrap");
  var btnNext = document.getElementById("btnNext");

  function scrollDown(){ chatWrap.scrollTop = chatWrap.scrollHeight; }
  function randDelay(min, max){ return min + Math.random() * (max - min); }

  function addTyping(){
    var row = document.createElement("div");
    row.className = "fchat-row them";
    row.innerHTML = '<div class="fchat-bubble typing"><span></span><span></span><span></span></div>';
    chatWrap.appendChild(row);
    scrollDown();
    return row;
  }

  function botSay(text, delayMs, cb){
    var typing = addTyping();
    setTimeout(function(){
      typing.remove();
      var row = document.createElement("div");
      row.className = "fchat-row them";
      row.innerHTML = '<div class="fchat-bubble">' + text + '</div>';
      chatWrap.appendChild(row);
      scrollDown();
      if (cb) cb();
    }, delayMs);
  }

  function meSay(text){
    var row = document.createElement("div");
    row.className = "fchat-row me";
    row.innerHTML = '<div class="fchat-bubble">' + text + '</div>';
    chatWrap.appendChild(row);
    scrollDown();
  }

  /* ---- roteiro do mini-quiz (3 perguntas) ---- */
  var questions = [
    {
      key: "resposta_localizacao",
      text: "Onde você sente a dor com mais frequência?",
      options: ["Só na lombar", "Desce até o glúteo ou a coxa", "Desce até abaixo do joelho, na perna toda"]
    },
    {
      key: "resposta_gatilho",
      text: "O que geralmente piora sua dor?",
      options: ["Ficar muito tempo sentado", "Ficar muito tempo em pé ou caminhando", "Se abaixar ou pegar peso"]
    },
    {
      key: "resposta_historico",
      text: "Você já tentou tratar antes (fisioterapia, alongamento, remédio) e a dor voltou?",
      options: ["Sim, várias vezes", "Já tentei uma vez", "Ainda não tratei de forma nenhuma"]
    }
  ];

  function askQuestion(i, delayMs){
    var q = questions[i];
    botSay(q.text, delayMs, function(){
      showOptions(q, i);
    });
  }

  function showOptions(q, i){
    var hint = document.createElement("div");
    hint.className = "fchat-tap-hint";
    hint.innerHTML = 'Toque pra responder <span class="tap-ico">👆</span>';
    chatWrap.appendChild(hint);

    var row = document.createElement("div");
    row.className = "fchat-row me";
    var group = document.createElement("div");
    group.className = "fchat-choice-group";
    row.appendChild(group);

    q.options.forEach(function(label){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "fchat-choice-bubble";
      btn.innerHTML = "<span>" + label + "</span><span class=\"fchat-choice-arrow\">›</span>";
      btn.addEventListener("click", function(){
        hint.remove();
        row.remove();
        meSay(label);

        try { localStorage.setItem(q.key, label); } catch(e){}
        Funil.trackEtapa("Etapa5_Quiz_" + q.key);

        if (i + 1 < questions.length) {
          askQuestion(i + 1, randDelay(300, 500));
        } else {
          finish();
        }
      });
      group.appendChild(btn);
    });

    chatWrap.appendChild(row);
    scrollDown();
  }

  function finish(){
    botSay("Pelo que você me contou, seu padrão faz muito sentido dentro do que eu trabalho no método. Deixa eu te mostrar algo assustador...", 2000, function(){
      btnNext.style.display = "flex";
      Funil.trackEtapa("Etapa5_QuizCompleted");
    });
  }

  botSay("Antes de continuar, deixa eu entender rapidinho seu caso. São só 3 perguntas.", randDelay(900, 1300), function(){
    askQuestion(0, randDelay(900, 1300));
  });

  btnNext.addEventListener("click", function(){
    Funil.trackEtapa("Etapa5_Click");
  });
</script>
</body>
</html>
