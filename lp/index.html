<body>

<div class="fstage">
  <div class="fcol">
    <div class="fbadge"><span id="liveCount">18</span> pessoas vendo essa página agora</div>

    <h1 class="fh1">Saia da crise de dor lombar em até 7 dias, sem depender de fisioterapia toda semana 🙌</h1>

    <p class="fhl-line"><span class="fhl">Método específico de acordo com o tipo da sua dor</span></p>

    <div class="fpick-label">Toque na imagem que mais parece com você agora:</div>
    <div class="fpick-grid">
      <a href="etapa02.html" class="fpick-card fcta-pulse" id="pickA">
        <img src="../img/dorlombar-card.jpg" alt="Pessoa com dor lombar localizada, sem irradiar para a perna">
        <div class="fpick-tag">Dor lombar <span class="arrow">→</span></div>
      </a>
      <a href="etapa02.html" class="fpick-card fcta-pulse" id="pickB">
        <img src="../img/duas-direita.jpg" alt="Pessoa com dor lombar que irradia até o pé">
        <div class="fpick-tag">Dor lombar com irradiação até o pé <span class="arrow">→</span></div>
      </a>
    </div>
  </div>
</div>

<script src="lp.js"></script>
<script>
  Funil.trackEtapa("Etapa1_View");
  if (typeof gtag === "function") gtag("event", "funil_etapa1_view");

  document.getElementById("pickA").addEventListener("click", function(){
    try { localStorage.setItem("resposta_identificacao", "lombar"); } catch(e){}
    Funil.trackEtapa("Etapa1_Click");
    Funil.trackEtapa("Etapa1_Pick_Lombar");
    if (typeof gtag === "function") {
      gtag("event", "funil_etapa1_click");
      gtag("event", "funil_etapa1_pick_lombar");
    }
  });
  document.getElementById("pickB").addEventListener("click", function(){
    try { localStorage.setItem("resposta_identificacao", "irradiada"); } catch(e){}
    Funil.trackEtapa("Etapa1_Click");
    Funil.trackEtapa("Etapa1_Pick_Irradiada");
    if (typeof gtag === "function") {
      gtag("event", "funil_etapa1_click");
      gtag("event", "funil_etapa1_pick_irradiada");
    }
  });

  /* ---- contador de "pessoas vendo agora" (varia sozinho para dar escassez) ---- */
  var liveCount = document.getElementById("liveCount");
  function tickLiveCount(){
    var next = 8 + Math.floor(Math.random() * 33); // entre 8 e 40
    liveCount.textContent = next;
    setTimeout(tickLiveCount, 2500 + Math.random() * 3000);
  }
  setTimeout(tickLiveCount, 2500 + Math.random() * 3000);
</script>
