<body>

<canvas id="confettiCanvas" style="position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:50;"></canvas>

<div class="fstage voucher-stage">
  <div class="fcol">
    <div class="feyebrow">Voucher resgatado</div>
    <h1 class="fh1" id="revealTitle">Resgatando seu voucher...</h1>

    <div class="fvoucher">
      <div class="ficon" id="voucherIcon">🎁</div>
      <div class="ftag">Voucher premiado</div>
      <div class="ftitle" id="voucherTitle">Validando seu código...</div>
      <div class="fvoucher-divider"></div>

      <div id="voucherResult" style="display:none;">
        <div class="fdiscount">72% OFF</div>
        <div class="fprice-line"><span class="old">De R$127,00</span><span class="new">R$35,00</span></div>
      </div>
      <div class="fremaining" id="loadingText">Só um instante...</div>
    </div>

    <a href="etapa09.html" class="fcta green fcta-pulse" id="btnNext" style="display:none;">Continuar <span class="arrow">→</span></a>
  </div>
</div>

<script src="lp.js"></script>
<script>
  Funil.trackEtapa("Etapa8_View");
  if (typeof gtag === "function") gtag("event", "funil_etapa8_view");
  Funil.setState({ discountPct: 72, priceFrom: "127,00", priceTo: "35,00" });

  setTimeout(function(){
    document.getElementById("revealTitle").textContent = "Parabéns! Seu desconto foi liberado 🎉";
    document.getElementById("voucherIcon").textContent = "🎉";
    document.getElementById("voucherTitle").textContent = "Voucher resgatado com sucesso";
    document.getElementById("loadingText").style.display = "none";
    document.getElementById("voucherResult").style.display = "block";

    Funil.confetti(document.getElementById("confettiCanvas"), 2600);
    Funil.playRewardSound();

    var btnNext = document.getElementById("btnNext");
    btnNext.style.display = "flex";
    Funil.trackEtapa("Etapa8_Revealed");
  }, 1400);

  document.getElementById("btnNext").addEventListener("click", function(){
    Funil.trackEtapa("Etapa8_Click");
    if (typeof gtag === "function") gtag("event", "funil_etapa8_click");
  });
</script>
</body>
